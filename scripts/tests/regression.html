<!doctype html><meta charset="utf-8"><title>Flashcard regression tests</title>
<style>body{font:14px system-ui;background:#fbf7f0;color:#173f37;padding:24px}li{margin:7px 0}.fail{color:#b21e12}iframe{display:block;border:1px solid #aaa;margin-top:20px}button{padding:12px}</style>
<h1>Flashcard regression tests</h1><p>Real app markup, stylesheet and vocabulary; speech is mocked. No analytics requests.</p><button onclick="location.reload()">Run again</button><h2 id="summary">Running…</h2><ol id="results"></ol><div id="frames"></div>
<script>
const results=document.querySelector('#results');let passed=0,failed=0;
function check(name,condition){const li=document.createElement('li');li.textContent=(condition?'PASS: ':'FAIL: ')+name;li.className=condition?'pass':'fail';results.append(li);condition?passed++:failed++}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function fixture(width=390,mode='normal'){
 const source=await (await fetch('../../index.html?qa='+Date.now())).text();
 const f=document.createElement('iframe');f.width=width;f.height=740;f.title=width+'px '+mode;document.querySelector('#frames').append(f);
 const mock=`window.qaErrors=[];window.addEventListener('error',e=>qaErrors.push(e.message));window.qaSpeech=[];window.qaCancels=0;Object.defineProperty(window,'speechSynthesis',{value:${mode==='unsupported'?'undefined':`{cancel(){qaCancels++},speak(u){qaSpeech.push(u)}}`}});window.SpeechSynthesisUtterance=class{constructor(text){this.text=text}};${mode==='error'?`window.fetch=async()=>({ok:false,status:503});`:mode==='empty'?`window.fetch=async()=>({ok:true,json:async()=>[]});`:''}`;
 const doc=new DOMParser().parseFromString(source,'text/html');doc.querySelectorAll('script').forEach(s=>s.remove());const base=doc.createElement('base');base.href=new URL('../../',location.href).href;doc.head.prepend(base);const setup=doc.createElement('script');setup.textContent=mock;doc.body.append(setup);const app=doc.createElement('script');app.src='assets/js/app.js?qa='+Date.now();doc.body.append(app);
 f.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;await new Promise((resolve,reject)=>{f.onload=resolve;setTimeout(()=>reject(Error('Fixture timeout')),10000)});for(let i=0;i<100;i++){if(f.contentDocument.querySelector('.card-word,.card-message'))break;await pause(20)}
 return {f,w:f.contentWindow,d:f.contentDocument,q:s=>f.contentDocument.querySelector(s)};
}
(async()=>{
 // Each ?v= in index.html must be the first 12 hex chars of that file's SHA-256 (same value deploy-s3.ps1 enforces).
 const indexSource=await(await fetch('../../index.html?qa='+Date.now())).text();for(const path of ['assets/css/style.css','assets/js/app.js']){const bytes=await(await fetch('../../'+path+'?qa='+Date.now())).arrayBuffer();const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,12);check(`index.html references current ${path} (?v=${hash})`,indexSource.includes(`${path}?v=${hash}`))}
 const data=await(await fetch('../../assets/data/cards.json')).json();const {f,w,d,q}=await fixture();const click=s=>q(s).click();const key=(el,k)=>el.dispatchEvent(new w.KeyboardEvent('keydown',{key:k,bubbles:true,cancelable:true}));const front=()=>q('#card-front').getAttribute('aria-hidden')==='false';
 check('All vocabulary loads with matching total',q('#progress-counter').textContent===`1 / ${data.length} cards`);
 check('No startup errors',w.qaErrors.length===0);check('Accessible card name references the visible word',q('#card').getAttribute('aria-labelledby')==='card-front');
 click('#reveal-btn');check('Reveal shows matching meaning and examples',!front()&&q('.card-translation').textContent===data[0].translation&&q('.example-nl').textContent===data[0].example&&q('.example-en').textContent===data[0].exampleTranslation);
 click('#next-btn');check('Next resets to front and updates progress',front()&&q('.card-word').textContent===data[1].word&&q('#progress-counter').textContent.startsWith('2 /'));
 click('#prev-btn');click('#prev-btn');check('Previous wraps to final card',q('.card-word').textContent===data.at(-1).word&&q('#progress-percentage').textContent==='100%');click('#next-btn');check('Next wraps to first card',q('.card-word').textContent===data[0].word);
 key(q('#card'),'Enter');check('Enter reveals focused card',!front());key(q('#card'),' ');check('Space hides focused card',front());key(d.body,'ArrowRight');check('Right arrow navigates',q('.card-word').textContent===data[1].word);key(d.body,'ArrowLeft');
 let filters=true;for(const cat of new Set(data.map(c=>c.category))){click(`[data-category="${cat}"]`);const cards=data.filter(c=>c.category===cat);filters&&=q('#progress-counter').textContent===`1 / ${cards.length} cards`&&q('.card-word').textContent===cards[0].word&&d.querySelectorAll('.chip[aria-pressed="true"]').length===1;click('#prev-btn');filters&&=q('.card-word').textContent===cards.at(-1).word}check('Every category filters, counts and wraps correctly',filters);
 click('[data-category="article"]');let before=new Set(data.filter(c=>c.category==='article').map(c=>c.word));click('#shuffle-btn');let after=new Set();for(let i=0;i<before.size;i++){after.add(q('.card-word').textContent);click('#next-btn')}check('Shuffle preserves every filtered card',before.size===after.size&&[...before].every(x=>after.has(x)));click('[data-category="all"]');
 for(const [value,rate] of [['normal',1],['slower',.75],['slow',.5]]){click(`[value="${value}"]`);click('#play-word-btn');let u=w.qaSpeech.at(-1);check(`Word speech uses Dutch and rate ${rate}`,u?.text===data[0].word&&u?.lang==='nl-NL'&&u?.rate===rate);u?.onend?.()}
 click('#play-example-btn');let u=w.qaSpeech.at(-1);check('Phrase audio reveals correct example',!front()&&u?.text===data[0].example);u?.onerror?.();check('Audio failure restores controls',!q('#play-example-btn').disabled);
 click('#play-word-btn');u=w.qaSpeech.at(-1);u?.onstart?.();const cancels=w.qaCancels;click('#next-btn');check('Changing card cancels obsolete audio and unlocks controls',w.qaCancels>cancels&&!q('#play-word-btn').disabled);u?.onend?.();
 click('#play-word-btn');const newest=w.qaSpeech.at(-1);u?.onerror?.();check('Late cancelled-speech events cannot unlock active playback',q('#play-word-btn').disabled);newest?.onend?.();
 const touch=(type,x,y)=>{const e=new w.Event(type,{bubbles:true});Object.defineProperty(e,'changedTouches',{value:[{clientX:x,clientY:y}]});q('#card').dispatchEvent(e)};
 const oldPosition=q('#progress-counter').textContent;touch('touchstart',220,100);touch('touchend',100,110);const swipedPosition=q('#progress-counter').textContent;q('#card').click();check('Horizontal swipe navigates without accidentally flipping',oldPosition!==swipedPosition&&front());touch('touchstart',100,100);touch('touchend',110,230);check('Vertical scrolling does not navigate',q('#progress-counter').textContent===swipedPosition);
 click('[data-category="article"]');click('[data-category="all"]');const speechCount=w.qaSpeech.length;click('#play-word-btn');click('#play-word-btn');check('Rapid audio clicks queue only one utterance',w.qaSpeech.length===speechCount+1);w.qaSpeech.at(-1)?.onend?.();
 // Inspect every front face at several real CSS viewport sizes.
 for(const width of [320,390,768,1280]){f.width=width;await pause(80);let fits=true,backFits=true;for(let i=0;i<data.length;i++){const word=q('.card-word'),hint=q('.card-hint'),tag=q('.card-tag');const r=word.getBoundingClientRect();fits&&=r.top>=tag.getBoundingClientRect().bottom-1&&r.bottom<=hint.getBoundingClientRect().top+1;backFits&&=q('#card-back').scrollWidth<=q('#card-back').clientWidth+1;click('#next-btn')}check(`All ${data.length} translations and examples stay within card width at ${width}px`,backFits);check(`All ${data.length} words fit between tag and hint at ${width}px`,fits);check(`No page horizontal overflow at ${width}px`,d.documentElement.scrollWidth<=d.documentElement.clientWidth+1)}
 const noAudio=await fixture(390,'unsupported');check('Unavailable speech disables audio controls',noAudio.q('#play-word-btn').disabled&&noAudio.q('#play-example-btn').disabled);check('Unavailable speech does not break study',!noAudio.q('#next-btn').disabled);check('Unavailable speech explains the limitation',!noAudio.q('#audio-status').hidden);
 for(const mode of ['empty','error']){const x=await fixture(390,mode);check(`${mode} data shows a useful message and disabled controls`,!!x.q('.card-message')&&x.q('#next-btn').disabled&&x.q('#reveal-btn').disabled&&x.q('#play-word-btn').disabled&&x.q('#progress-counter').textContent==='0 / 0 cards');check(`${mode} data has no uncaught errors`,x.w.qaErrors.length===0)}
 document.querySelector('#summary').textContent=`${passed} passed · ${failed} failed`;
})().catch(e=>{check('Harness completed: '+e.message,false);document.querySelector('#summary').textContent=`${passed} passed · ${failed} failed (interrupted)`});
</script>
